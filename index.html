<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="RashuMedia - Latest news from the Maldives"
    >

    <title>RashuMedia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="header-container">

            <a href="#home" class="brand">
                <img
                    src="rashumedia logo.png"
                    alt="RashuMedia"
                >
            </a>


            <button
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <nav class="navigation" id="navigation">

                <a href="#home">
                    Home
                </a>

                <a href="#latest">
                    Latest News
                </a>

                <a href="#maldives">
                    Maldives
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main id="home">


        <!-- =========================
             HTV LIVE SECTION
        ========================== -->

        <section class="live-section">

            <div class="main-container">


                <!-- HTV LOGO ABOVE PLAYER -->

                <div class="htv-brand">

                    <img
                        src="htv logo.png"
                        alt="HTV"
                    >

                </div>



                <div class="live-header">

                    <div>

                        <div class="section-label">
                            HTV
                        </div>

                        <h1>
                            Live
                        </h1>

                    </div>


                    <div
                        id="liveStatus"
                        class="live-status"
                    >
                        Checking...
                    </div>

                </div>



                <!-- PLAYER -->

                <div class="player-container">


                    <!-- OFFLINE IMAGE -->

                    <img
                        id="offlineImage"
                        class="offline-image"
                        src="notplaying.png"
                        alt="HTV is not currently live"
                    >


                    <!-- YOUTUBE PLAYER -->

                    <div
                        id="youtubeContainer"
                        class="youtube-container"
                        hidden
                    >

                        <iframe
                            id="youtubePlayer"
                            title="HTV Live"
                            src=""
                            allow="
                                autoplay;
                                encrypted-media;
                                picture-in-picture
                            "
                            allowfullscreen
                        ></iframe>


                        <div class="live-indicator">

                            <span></span>

                            LIVE

                        </div>

                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             NEWS SECTION
        ========================== -->

        <section
            class="news-section"
            id="latest"
        >

            <div class="main-container">


                <div class="news-heading">

                    <div>

                        <div class="section-label">
                            RASHUMEDIA
                        </div>

                        <h2>
                            Latest News
                        </h2>

                        <p>
                            Latest news from the Maldives
                        </p>

                    </div>


                    <div
                        id="lastUpdated"
                        class="last-updated"
                    >
                        Last updated: —
                    </div>

                </div>



                <!-- NEWS GRID -->

                <div
                    id="newsGrid"
                    class="news-grid"
                ></div>



                <!-- ERROR -->

                <div
                    id="errorMessage"
                    class="error-message"
                    hidden
                >

                    <h3>
                        Unable to load the latest news right now.
                    </h3>

                    <button
                        id="retryButton"
                        class="retry-button"
                    >
                        Try Again
                    </button>

                </div>

            </div>

        </section>



        <section
            id="maldives"
            class="maldives-anchor"
        ></section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="main-container footer-content">

            <span>
                © <span id="currentYear"></span> RashuMedia
            </span>

            <span>
                Maldives
            </span>

        </div>

    </footer>



    <script src="script.js"></script>

</body>
</html>
